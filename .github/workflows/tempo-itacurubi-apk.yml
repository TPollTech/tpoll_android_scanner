name: Tempo Itacurubi APK
on:
  push:
    branches: [tempo-itacurubi-apk]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Instalar Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compilar APK
        working-directory: tempo-itacurubi
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: TempoItacurubi-APK
          path: tempo-itacurubi/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
