name: Build and publish APK

concurrency:
  group: build-apk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths-ignore:
      - 'TPollScanner-release.apk'
      - 'BUILD_FAILURE.txt'
      - '**/*.md'
      - 'update.json'
      - 'android_app/app/build.gradle.kts'

permissions:
  contents: write

jobs:
  build-apk:
    if: github.event_name != 'pull_request' || github.actor != 'github-actions[bot]'
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore google-services.json if secret exists
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android_app/app/google-services.json
            echo "google-services.json restored from secret."
          else
            echo "GOOGLE_SERVICES_JSON_BASE64 secret not set. Building without Google login config."
          fi

      - name: Restore release keystore if secrets exist
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$RELEASE_STORE_PASSWORD" ] && [ -n "$RELEASE_KEY_ALIAS" ] && [ -n "$RELEASE_KEY_PASSWORD" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > android_app/release.keystore
            {
              echo ""
              echo "RELEASE_STORE_FILE=../release.keystore"
              echo "RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD"
              echo "RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS"
              echo "RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD"
            } >> android_app/gradle.properties
            echo "Release keystore restored from secrets."
          else
            echo "Release signing secrets not set. APK will be signed with debug fallback key."
          fi

      - name: Auto-increment version
        if: github.event_name == 'push'
        run: |
          # Read current version_code from build.gradle.kts (source of truth)
          CURRENT_VERSION=$(grep -oP 'versionCode = \K[0-9]+' android_app/app/build.gradle.kts)
          NEW_VERSION=$((CURRENT_VERSION + 1))

          # Read current version_name base from build.gradle.kts
          CURRENT_NAME=$(grep -oP 'versionName = "\K[^"]+' android_app/app/build.gradle.kts)
          # Increment patch number: e.g. 1.8.0 -> 1.8.1
          NEW_VERSION_NAME=$(python3 -c "
          parts = '$CURRENT_NAME'.split('.')
          if len(parts) == 3:
              parts[2] = str(int(parts[2]) + 1)
          elif len(parts) == 2:
              parts.append('1')
          else:
              parts = ['1', '0', '1']
          print('.'.join(parts))
          ")

          echo "Current version: $CURRENT_VERSION ($CURRENT_NAME)"
          echo "New version: $NEW_VERSION ($NEW_VERSION_NAME)"

          # Update build.gradle.kts versionCode and versionName
          sed -i "s/versionCode = [0-9]*/versionCode = $NEW_VERSION/" android_app/app/build.gradle.kts
          sed -i "s/versionName = \"[^\"]*\"/versionName = \"$NEW_VERSION_NAME\"/" android_app/app/build.gradle.kts

          # Update update.json
          python3 -c "
          import json
          with open('update.json', 'r') as f:
              data = json.load(f)
          data['version_code'] = $NEW_VERSION
          data['version_name'] = '$NEW_VERSION_NAME'
          with open('update.json', 'w') as f:
              json.dump(data, f, indent=2, ensure_ascii=False)
          "

          echo "VERSION_CODE=$NEW_VERSION" >> $GITHUB_ENV
          echo "VERSION_NAME=$NEW_VERSION_NAME" >> $GITHUB_ENV

      - name: Build release APK
        id: build
        continue-on-error: true
        working-directory: android_app
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew clean assembleRelease 2>&1 | tee ../build.log

      - name: Commit build failure report
        if: steps.build.outcome == 'failure' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          {
            echo "Build APK failed at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo ""
            tail -n 220 build.log
          } > BUILD_FAILURE.txt
          git add -f BUILD_FAILURE.txt
          git commit -m "Registrar erro do build APK" || true
          git push || true

      - name: Upload build log on failure
        if: steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: TPollScanner-build-log
          path: build.log

      - name: Stop after build failure
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Copy APK to site download path
        if: steps.build.outcome == 'success'
        run: |
          cp android_app/app/build/outputs/apk/release/app-release.apk TPollScanner-release.apk
          rm -f BUILD_FAILURE.txt
          ls -lh TPollScanner-release.apk
          sha256sum TPollScanner-release.apk

      - name: Upload APK artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: TPollScanner-release
          path: TPollScanner-release.apk

      - name: Commit APK to pull request branch
        if: steps.build.outcome == 'success' && github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f TPollScanner-release.apk
          if git diff --cached --quiet; then
            echo "APK unchanged. Nothing to commit."
          else
            git commit -m "Publicar APK 1.8.0"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Commit APK to main for GitHub Pages download
        if: steps.build.outcome == 'success' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f TPollScanner-release.apk update.json android_app/app/build.gradle.kts
          if [ -f BUILD_FAILURE.txt ]; then git add -u BUILD_FAILURE.txt; fi
          if git diff --cached --quiet; then
            echo "APK unchanged. Nothing to commit."
          else
            git commit -m "Build v${{ env.VERSION_NAME }} (auto)"
            git push
          fi
