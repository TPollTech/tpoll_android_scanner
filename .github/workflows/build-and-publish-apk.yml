name: Build and publish APK

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'TPollScanner-release.apk'
      - 'BUILD_FAILURE.txt'
      - '**/*.md'
      - 'update.json'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build and publish signed release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up JDK 17 with Gradle cache
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android_app/*.gradle.kts
            android_app/gradle/wrapper/gradle-wrapper.properties

      - name: Validate release and updater invariants
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Restore google-services.json if configured
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android_app/app/google-services.json
            echo "google-services.json restored from secret."
          else
            echo "GOOGLE_SERVICES_JSON_BASE64 is not configured; Firebase login stays disabled."
          fi

      - name: Restore mandatory release signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_CERT_SHA256: ${{ secrets.RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "$RELEASE_KEYSTORE_BASE64" ] || missing+=(RELEASE_KEYSTORE_BASE64)
          [ -n "$RELEASE_STORE_PASSWORD" ] || missing+=(RELEASE_STORE_PASSWORD)
          [ -n "$RELEASE_KEY_ALIAS" ] || missing+=(RELEASE_KEY_ALIAS)
          [ -n "$RELEASE_KEY_PASSWORD" ] || missing+=(RELEASE_KEY_PASSWORD)
          [ -n "$RELEASE_CERT_SHA256" ] || missing+=(RELEASE_CERT_SHA256)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "Missing mandatory GitHub Actions secrets: ${missing[*]}"
            echo "See RELEASE_SIGNING.md. No APK was published."
            exit 1
          fi

          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > android_app/release.keystore
          {
            echo ""
            echo "RELEASE_STORE_FILE=../release.keystore"
            echo "RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD"
            echo "RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS"
            echo "RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD"
          } >> android_app/gradle.properties

          keytool -list \
            -keystore android_app/release.keystore \
            -storepass "$RELEASE_STORE_PASSWORD" \
            -alias "$RELEASE_KEY_ALIAS" >/dev/null
          echo "Release keystore and alias validated."

      - name: Determine next release version
        id: version
        run: |
          python3 scripts/release_manifest.py next \
            --manifest update.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Build and test release APK
        id: build
        working-directory: android_app
        env:
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew clean testReleaseUnitTest lintRelease assembleRelease \
            -PAPP_VERSION_CODE="$VERSION_CODE" \
            -PAPP_VERSION_NAME="$VERSION_NAME" \
            2>&1 | tee ../build.log

      - name: Add build failure to the run summary
        if: failure() && steps.build.outcome == 'failure'
        run: |
          {
            echo '## Release build failed'
            echo ''
            echo '```text'
            tail -n 120 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log on failure
        if: failure() && steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: TPollScanner-build-log
          path: build.log
          retention-days: 14

      - name: Prepare release artifact
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          cp android_app/app/build/outputs/apk/release/app-release.apk TPollScanner-release.apk
          ls -lh TPollScanner-release.apk
          sha256sum TPollScanner-release.apk
          echo "RELEASE_TAG=v$VERSION_NAME" >> "$GITHUB_ENV"
          echo "APK_URL=https://github.com/${{ github.repository }}/releases/download/v$VERSION_NAME/TPollScanner-release.apk" >> "$GITHUB_ENV"

      - name: Verify package, version, and release certificate
        env:
          EXPECTED_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          EXPECTED_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          RELEASE_CERT_SHA256: ${{ secrets.RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK_SIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          AAPT2=$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -n 1)
          VERIFY_OUTPUT=$($APK_SIGNER verify --verbose --print-certs TPollScanner-release.apk)
          BADGING=$($AAPT2 dump badging TPollScanner-release.apk | head -n 1)
          printf '%s\n' "$VERIFY_OUTPUT"
          printf '%s\n' "$BADGING"

          if printf '%s\n' "$VERIFY_OUTPUT" | grep -q 'CN=Android Debug'; then
            echo "Refusing to publish an APK signed with an Android Debug certificate."
            exit 1
          fi

          ACTUAL_CERT=$(printf '%s\n' "$VERIFY_OUTPUT" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p; s/^V2 Signer: certificate SHA-256 digest: //p' | head -n 1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          EXPECTED_CERT=$(printf '%s' "$RELEASE_CERT_SHA256" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          ACTUAL_PACKAGE=$(printf '%s\n' "$BADGING" | sed -n "s/.*package: name='\([^']*\)'.*/\1/p")
          ACTUAL_VERSION_CODE=$(printf '%s\n' "$BADGING" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p")
          ACTUAL_VERSION_NAME=$(printf '%s\n' "$BADGING" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")

          [ "$ACTUAL_CERT" = "$EXPECTED_CERT" ] || { echo "Release certificate mismatch."; exit 1; }
          [ "$ACTUAL_PACKAGE" = "com.tpoll.scanner" ] || { echo "Unexpected package: $ACTUAL_PACKAGE"; exit 1; }
          [ "$ACTUAL_VERSION_CODE" = "$EXPECTED_VERSION_CODE" ] || { echo "Unexpected versionCode: $ACTUAL_VERSION_CODE"; exit 1; }
          [ "$ACTUAL_VERSION_NAME" = "$EXPECTED_VERSION_NAME" ] || { echo "Unexpected versionName: $ACTUAL_VERSION_NAME"; exit 1; }
          echo "Package, version, and release certificate verified."

      - name: Download and verify the currently published APK
        run: |
          set -euo pipefail
          cp update.json previous-update.json
          PREVIOUS_APK_URL=$(python3 -c "import json; print(json.load(open('previous-update.json', encoding='utf-8'))['apk_url'])")
          curl --fail --location --retry 3 --retry-all-errors \
            --output previous-release.apk \
            "$PREVIOUS_APK_URL"
          python3 scripts/release_manifest.py verify \
            --manifest previous-update.json \
            --apk previous-release.apk

      - name: Finalize and verify update manifest
        env:
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          python3 scripts/release_manifest.py finalize \
            --manifest update.json \
            --apk TPollScanner-release.apk \
            --version-code "$VERSION_CODE" \
            --version-name "$VERSION_NAME" \
            --apk-url "$APK_URL"
          python3 scripts/release_manifest.py verify \
            --manifest update.json \
            --apk TPollScanner-release.apk

      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | \
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke-test signed upgrade on Android 15
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          EXPECTED_VERSION_CODE: ${{ steps.version.outputs.version_code }}
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -eu
            adb install previous-release.apk
            PREVIOUS_VERSION=$(adb shell dumpsys package com.tpoll.scanner | sed -n 's/.*versionCode=\([0-9]*\).*/\1/p' | head -n 1)
            adb install -r TPollScanner-release.apk
            INSTALLED_VERSION=$(adb shell dumpsys package com.tpoll.scanner | sed -n 's/.*versionCode=\([0-9]*\).*/\1/p' | head -n 1)
            [ -n "$PREVIOUS_VERSION" ] || { echo "Could not read previous versionCode."; exit 1; }
            [ -n "$INSTALLED_VERSION" ] || { echo "Could not read installed versionCode."; exit 1; }
            [ "$PREVIOUS_VERSION" -lt "$INSTALLED_VERSION" ] || { echo "Upgrade did not increase versionCode."; exit 1; }
            [ "$INSTALLED_VERSION" = "$EXPECTED_VERSION_CODE" ] || { echo "Installed versionCode is $INSTALLED_VERSION."; exit 1; }
            adb shell am start -W -n com.tpoll.scanner/.MainActivity | tee launch-result.txt
            grep -q 'Status: ok' launch-result.txt
            echo "Signed in-place upgrade and app launch verified."

      - name: Ensure this is still the newest source commit
        run: |
          git fetch origin main
          REMOTE_HEAD=$(git rev-parse origin/main)
          if [ "$REMOTE_HEAD" != "$GITHUB_SHA" ]; then
            echo "A newer source commit reached main. This stale release will not be published."
            exit 1
          fi

      - name: Upload signed APK workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: TPollScanner-release-${{ steps.version.outputs.version_name }}
          path: TPollScanner-release.apk
          retention-days: 30

      - name: Publish immutable release and manifest last
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          set -Eeuo pipefail
          release_owned=false

          cleanup_unpublished_release() {
            [ "$release_owned" = true ] || return 0
            git fetch origin main --quiet || true
            REMOTE_APK_URL=$(git show origin/main:update.json 2>/dev/null | \
              python3 -c "import json,sys; print(json.load(sys.stdin).get('apk_url', ''))" 2>/dev/null || true)
            if [[ "$REMOTE_APK_URL" == *"/releases/download/$RELEASE_TAG/"* ]]; then
              echo "Release $RELEASE_TAG is already referenced by the public manifest; keeping it."
              return 0
            fi
            echo "Removing unpublished release $RELEASE_TAG after publication failure."
            gh release delete "$RELEASE_TAG" --cleanup-tag --yes || true
          }
          trap cleanup_unpublished_release ERR INT TERM

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            TAG_COMMIT=$(git rev-list -n 1 "$RELEASE_TAG")
            [ "$TAG_COMMIT" = "$GITHUB_SHA" ] || {
              echo "Release tag $RELEASE_TAG already belongs to another commit."
              exit 1
            }
            release_owned=true
            gh release upload "$RELEASE_TAG" TPollScanner-release.apk --clobber
          else
            release_owned=true
            gh release create "$RELEASE_TAG" TPollScanner-release.apk \
              --target "$GITHUB_SHA" \
              --title "TPoll Scanner $VERSION_NAME" \
              --generate-notes
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch TPollScanner-release.apk BUILD_FAILURE.txt
          git add update.json
          git commit -m "release: v$VERSION_NAME"
          git push origin HEAD:main
          trap - ERR INT TERM
