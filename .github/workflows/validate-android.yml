name: Validate Android release

on:
  workflow_dispatch:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

jobs:
  validate-release:
    name: Compile, test, and lint release code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17 with Gradle cache
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            android_app/*.gradle.kts
            android_app/gradle/wrapper/gradle-wrapper.properties

      - name: Validate repository invariants
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Compile, test, and lint release code
        working-directory: android_app
        run: |
          chmod +x ./gradlew
          ./gradlew testReleaseUnitTest lintRelease compileReleaseKotlin
