name: Build HdRecover Mobile APK

on:
  push:
    branches: [main]
    paths:
      - "hdrecover_android/**"
      - ".github/workflows/build-hdrecover-apk.yml"
  pull_request:
    branches: [main]
    paths:
      - "hdrecover_android/**"
      - ".github/workflows/build-hdrecover-apk.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Aplicar correção de compatibilidade do Java
        run: python3 hdrecover_android/ci_patch.py

      - name: Compilar APK de teste
        id: gradle_build
        shell: bash
        run: |
          set -o pipefail
          chmod +x android_app/gradlew
          android_app/gradlew -p hdrecover_android clean assembleDebug --stacktrace 2>&1 | tee hdrecover_build.log

      - name: Salvar log de falha no repositório
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tail -n 220 hdrecover_build.log > hdrecover_build_error.txt
          CONTENT=$(base64 -w0 hdrecover_build_error.txt)
          SHA=$(gh api "repos/${GITHUB_REPOSITORY}/contents/hdrecover_build_error.txt?ref=main" --jq .sha 2>/dev/null || true)
          if [ -n "$SHA" ]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/hdrecover_build_error.txt" \
              -f message='ci: atualizar diagnóstico do HdRecover' \
              -f content="$CONTENT" \
              -f branch='main' \
              -f sha="$SHA"
          else
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/hdrecover_build_error.txt" \
              -f message='ci: salvar diagnóstico do HdRecover' \
              -f content="$CONTENT" \
              -f branch='main'
          fi

      - name: Publicar erro de compilação no PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### Log final da compilação do HdRecover"
            echo '```text'
            tail -n 160 hdrecover_build.log
            echo '```'
          } > hdrecover_error_comment.md
          gh pr comment "${{ github.event.pull_request.number }}" --body-file hdrecover_error_comment.md

      - name: Preparar APK
        run: |
          cp hdrecover_android/app/build/outputs/apk/debug/app-debug.apk HdRecover-Mobile-v0.1.0.apk
          sha256sum HdRecover-Mobile-v0.1.0.apk > HdRecover-Mobile-v0.1.0.sha256

      - name: Publicar artefato do workflow
        uses: actions/upload-artifact@v4
        with:
          name: HdRecover-Mobile-v0.1.0
          path: |
            HdRecover-Mobile-v0.1.0.apk
            HdRecover-Mobile-v0.1.0.sha256

      - name: Publicar APK na área de releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: hdrecover-android-v0.1.0
          name: HdRecover Mobile v0.1.0
          body: |
            Primeira versão Android dedicada do HdRecover.

            Conecte um HD, SSD ou pendrive por USB OTG e selecione uma pasta de destino diferente do dispositivo de origem.
          prerelease: true
          files: |
            HdRecover-Mobile-v0.1.0.apk
            HdRecover-Mobile-v0.1.0.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
